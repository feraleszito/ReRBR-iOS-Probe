# Standalone repository layout: Cargo.toml, scripts/ and xcode/ are at the root.
# Manual unsigned device build. Template: github-actions/ios-probe.yml.
# GitHub discovers the activated copy at .github/workflows/ios-probe.yml only.
name: ReRBRProbe unsigned iPadOS

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Triangle fallback or fixed 3D floor and cube
        required: true
        default: triangle
        type: choice
        options:
          - triangle
          - rerbr-3d

permissions:
  contents: read

concurrency:
  group: ios-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      # Use a known installed Xcode, not the runner's changing default.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Check standalone repository layout
        run: |
          for file in Cargo.toml Cargo.lock scripts/build-ios.sh scripts/verify.py xcode/ReRBRProbe.xcodeproj/project.pbxproj; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Expected $file at the repository root. Copy the contents of the probe, without an ios-probe wrapper directory."
              exit 1
            fi
          done

      - name: Check Xcode and iPhoneOS SDK
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install the pinned Rust toolchain and device target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios

      - name: Cache only the independent probe build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ios-probe-root-xcode-16.4

      - name: Compile and inspect unsigned device IPA
        env:
          PROBE_MODE: ${{ inputs.build_mode }}
        run: bash scripts/build-ios.sh

      - name: Upload unsigned IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ReRBRProbe-unsigned-${{ inputs.build_mode }}-${{ github.run_number }}
          path: |
            build/ReRBRProbe-unsigned.ipa
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReRBRProbe-logs-${{ inputs.build_mode }}-${{ github.run_number }}
          path: |
            build/*.log
            build/*.txt
          if-no-files-found: ignore
          retention-days: 7
