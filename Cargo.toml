[package]
name = "rerbr-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Standalone iPadOS Metal experiment with an optional reRBR camera/math library; no game assets"
license = "GPL-3.0-or-later"

# A nested workspace keeps this experiment independent of ../Cargo.toml and ../Cargo.lock.
[workspace]
members = ["vendor/rerbr-render-core"]
default-members = ["."]
resolver = "2"

[features]
default = []
# First integration batch: compile the original camera/math code without changing the triangle.
rerbr-3d = ["dep:rerbr-render-core"]

[lib]
name = "rerbr_probe"
crate-type = ["staticlib", "rlib"]

[dependencies]
futures-executor = "=0.3.34"
rerbr-render-core = { path = "vendor/rerbr-render-core", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[profile.release]
panic = "abort"
debug = 1
