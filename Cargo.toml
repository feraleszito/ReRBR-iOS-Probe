[package]
name = "rerbr-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Standalone iPadOS Metal experiment with optional reRBR math and asset readers; no game assets"
license = "GPL-3.0-or-later"

# A nested workspace keeps this experiment independent of ../Cargo.toml and ../Cargo.lock.
[workspace]
members = ["vendor/rerbr-render-core", "vendor/rerbr-asset-formats", "vendor/rerbr-sim", "vendor/rerbr-sim/upstream/*"]
default-members = ["."]
resolver = "2"

[features]
default = []
# Optional 3D scene and private-file diagnostic; default stays triangle.
rerbr-3d = ["dep:rerbr-render-core", "dep:rerbr-asset-formats"]
# Visual priority: car chase > benchmark > neighbors > block > procedural 3D > triangle.
harwood-block = ["dep:rerbr-render-core", "dep:rerbr-asset-formats"]
harwood-neighbors = ["dep:rerbr-render-core", "dep:rerbr-asset-formats"]
# Separate app mode; shares the exact neighbor workload and its optional dependencies.
harwood-benchmark = ["harwood-neighbors"]
car-chase-benchmark = ["harwood-benchmark"]
physics-probe = ["dep:rerbr-sim"]

[lib]
name = "rerbr_probe"
crate-type = ["staticlib", "rlib"]

[dependencies]
futures-executor = "=0.3.34"
rerbr-render-core = { path = "vendor/rerbr-render-core", optional = true }
rerbr-asset-formats = { path = "vendor/rerbr-asset-formats", optional = true }
rerbr-sim = { path = "vendor/rerbr-sim", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[[example]]
name = "harwood-diagnostic"
required-features = ["rerbr-3d"]

[[example]]
name = "harwood-block-diagnostic"
required-features = ["harwood-block"]

[[example]]
name = "harwood-neighbors-diagnostic"
required-features = ["harwood-neighbors"]

[[example]]
name = "harwood-benchmark-diagnostic"
required-features = ["harwood-benchmark"]

[[example]]
name = "car-chase-diagnostic"
required-features = ["car-chase-benchmark"]

[[example]]
name = "physics-diagnostic"
required-features = ["physics-probe"]

[profile.release]
panic = "abort"
debug = 1
